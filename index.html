<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家谱关系梳理与称谓演算板</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="topbar">
  <div class="logo"><span class="tree-ic">🌳</span>家谱演算板</div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="btn primary" id="btnAdd">＋ 添加人物</button>
    <select class="tb-select" id="genFilter" title="按辈分筛选"></select>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="btn" id="btnLayout" title="按辈分自动排列">自动布局</button>
    <button class="btn" id="btnFit" title="适应窗口">适应</button>
    <button class="btn ghost" id="btnZoomOut">－</button>
    <span id="zoomLabel">100%</span>
    <button class="btn ghost" id="btnZoomIn">＋</button>
  </div>
  <div id="egoChip">称谓基准：<b id="egoName"></b><span class="clear-x" id="egoClear" title="取消基准">✕</span></div>
  <div class="spacer"></div>
  <div class="tb-group">
    <button class="btn" id="btnSample">载入示例</button>
    <button class="btn" id="btnExportJson">导出 JSON</button>
    <button class="btn" id="btnImportJson">导入 JSON</button>
    <button class="btn" id="btnExportPng">导出 PNG</button>
    <button class="btn danger" id="btnClear">清空</button>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div id="tabs">
      <div class="tab active" data-tab="people">人物</div>
      <div class="tab" data-tab="branches">支系</div>
      <div class="tab" data-tab="kin">称谓演算</div>
      <div class="tab" data-tab="issues">校验<span id="issueBadge" class="issue-badge" style="display:none"></span></div>
    </div>
    <div id="sideBody"></div>
  </div>
  <div id="canvasWrap">
    <div id="viewport">
      <svg id="edgeLayer" width="1" height="1"></svg>
      <div id="nodeLayer"></div>
    </div>
    <div id="emptyHint"><div class="box">
      <div class="big">👨‍👩‍👧‍👦</div>
      <b>画布还是空的</b><br>
      点击左上角「＋ 添加人物」开始录入，<br>或点击「载入示例」快速体验。<br>
      <span style="font-size:11px">拖拽背景平移 · 滚轮缩放 · 双击节点设为称谓基准</span>
    </div></div>
    <div id="canvasLegend">
      <span class="lg-item"><svg width="28" height="6"><line x1="0" y1="3" x2="28" y2="3" stroke="#b9c3d4" stroke-width="2"/></svg>亲生</span>
      <span class="lg-item"><svg width="28" height="6"><line x1="0" y1="3" x2="28" y2="3" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4"/></svg>收养/继亲</span>
      <span class="lg-item"><svg width="28" height="6"><line x1="0" y1="3" x2="28" y2="3" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 4"/></svg>配偶</span>
    </div>
    <div id="canvasHint">
      拖拽节点整理布局 · 拖空白处平移 · 滚轮缩放<br>
      双击节点 = 设为称谓基准（演算以其为“我”）
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json,application/json" style="display:none">
<div id="toast"></div>
<div id="modalMask">
  <div class="modal">
    <h3 id="mTitle">确认</h3>
    <div id="mBody" class="m-body"></div>
    <div class="m-btns">
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mOk">确定</button>
    </div>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/relations.js"></script>
<script src="js/validate.js"></script>
<script src="js/kinship.js"></script>
<script src="js/canvas.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/editor.js"></script>
<script src="js/io.js"></script>
<script src="js/main.js"></script>
</body>
</html>
